<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Hanonyy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap">
<style>
/* Layout: one full-screen stage, pink matrix rain with a countdown and the greeting words centered over it. */
:root {
  --night: #07040f;
  --pink: #ff5fae;
  --pink-soft: #ffc2e0;
  --glow: rgba(255, 95, 174, .55);
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--pink-soft);
  font-family: var(--font-display);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#app { position: fixed; inset: 0; background: var(--night); overflow: hidden; user-select: none; -webkit-user-select: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#big {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-weight: 900; font-size: clamp(56px, 20vw, 120px); line-height: 1.1;
  color: var(--pink); text-align: center; padding: 0 16px;
  text-shadow: 0 0 24px var(--glow), 0 0 4px #000, 0 0 40px #000;
  pointer-events: none;
}
#big::before { content: ""; position: absolute; inset: 28% 0; background: radial-gradient(ellipse at center, rgba(7,4,15,.88) 0%, rgba(7,4,15,.6) 45%, transparent 72%); }
#big:empty::before { display: none; }
#big span { position: relative; display: inline-block; animation: pop .55s cubic-bezier(.2, 1.5, .4, 1) both; }
#big.long span { font-size: .8em; }
#big.name span { font-size: 1.05em; }
#big.heart span { font-size: 1.5em; animation: pop .55s cubic-bezier(.2, 1.5, .4, 1) both, beat 1.6s ease-in-out .6s infinite; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
#replay {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: max(5vh, calc(env(safe-area-inset-bottom, 0px) + 24px));
  background: rgba(7, 4, 15, .7); color: var(--pink-soft); border: 1px solid rgba(255, 194, 224, .5); border-radius: 999px;
  padding: 9px 22px; font: 900 14px var(--font-display); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .8s ease;
}
#replay.show { opacity: 1; pointer-events: auto; }
#replay:focus-visible { outline: 2px solid var(--pink); outline-offset: 4px; }
@media (prefers-reduced-motion: reduce) { #big.heart span { animation: pop .01s both; } }
#startBtn { position: absolute; inset: 0; z-index: 5; width: 100%; background: radial-gradient(ellipse at center, rgba(7,4,15,.9) 0%, rgba(7,4,15,.55) 60%, rgba(7,4,15,.3) 100%); color: var(--pink); border: 0;
  font: 900 clamp(28px, 8vw, 48px) var(--font-display); text-shadow: 0 0 20px var(--glow), 0 0 6px #000, 0 0 30px #000; cursor: pointer; }
@keyframes hint { 50% { opacity: .8; } }
#startBtn { animation: hint 1.8s ease-in-out infinite; }
</style>

</head>
<body>
<div id="app" dir="ltr">
  <canvas id="rain"></canvas>
  <div id="big" aria-live="polite"></div>
  <button id="replay" type="button">Replay</button>
  <button id="startBtn" type="button">Tap anywhere ♥</button>
</div>

<script>
(function () {
  const WORDS = ["Happy", "Birth", "Day"];
  const NAME = "Hanonyy 💜🫶";

  const $ = (id) => document.getElementById(id);
  const app = $("app"), rain = $("rain"), big = $("big"), replay = $("replay");
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const ctx = rain.getContext("2d");
  const glyphs = "0101♥10";
  let W = 0, H = 0, fs = 16, cols = [], last = 0, token = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function fit() {
    W = app.clientWidth; H = app.clientHeight;
    rain.width = W * dpr; rain.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fs = W < 500 ? 14 : 18;
    cols = Array.from({ length: Math.ceil(W / fs) }, () => Math.random() * -40);
    ctx.fillStyle = "#07040f"; ctx.fillRect(0, 0, W, H);
  }
  function draw(t) {
    if (t - last > 38) {
      last = t;
      ctx.fillStyle = "rgba(7,4,15,.06)"; ctx.fillRect(0, 0, W, H);
      ctx.font = fs + "px monospace"; ctx.textAlign = "center";
      for (let i = 0; i < cols.length; i++) {
        const y = cols[i] * fs, x = i * fs + fs / 2;
        const g = () => glyphs[(Math.random() * glyphs.length) | 0];
        ctx.fillStyle = "#ffe3f1"; ctx.fillText(g(), x, y);
        ctx.fillStyle = "#ff5fae"; ctx.fillText(g(), x, y - fs);
        ctx.fillStyle = "#e0409a"; ctx.fillText(g(), x, y - fs * 2);
        if (y > H && Math.random() > .965) cols[i] = 0; else cols[i] += 1;
      }
    }
    requestAnimationFrame(draw);
  }
  function say(text, cls) {
    big.className = cls || "";
    big.innerHTML = "";
    const s = document.createElement("span"); s.textContent = text; big.appendChild(s);
  }
  async function start() {
    const me = ++token; replay.classList.remove("show"); big.innerHTML = "";
    await sleep(700); if (me !== token) return;
    for (const n of ["3", "2", "1"]) { say(n); await sleep(950); if (me !== token) return; }
    for (const w of WORDS) { say(w, "long"); await sleep(750); if (me !== token) return; }
    say(NAME, "name"); await sleep(1300); if (me !== token) return;
    say("♥", "heart");
    await sleep(1800); if (me !== token) return;
    replay.classList.add("show");
  }
  window.addEventListener("resize", fit);

  /* ===== Song ===== */
  const START_AT = 3;   // second where "3" is said inside the clip (e.g. 1:05 = 65)
  const LEAD = 0.7;     // keep as is: page waits this long before showing "3"
  const seekTime = Math.max(0, START_AT - LEAD);
  const btn = $("startBtn");
  const audio = new Audio("https://f.top4top.io/m_3971t1ux41.mp3");
  audio.preload = "auto"; audio.loop = true;
  let beginRef = null;

  function go() {
    let done = false;
    const begin = () => { if (done) return; done = true; beginRef = null; start(); };
    beginRef = begin;
    try {
      audio.currentTime = seekTime;
      const pr = audio.play();
      if (pr && pr.catch) pr.catch(begin);
    } catch (e) { begin(); return; }
    setTimeout(begin, 2500);
  }
  audio.addEventListener("playing", () => { if (beginRef) beginRef(); });
  btn.addEventListener("click", () => { btn.remove(); go(); });
  replay.addEventListener("click", go);
  fit(); requestAnimationFrame(draw);
})();
</script>
</body>
</html>
